<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-label="Bound the result set before fetching inherited entities"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566775"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#22313c"><text x="30" y="32" font-size="17" text-anchor="start">Before: LIMIT is applied after the expensive joins</text><rect x="30" y="55" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="152.5" y="91.0" font-size="15" text-anchor="middle">Read ~1,000,000 posts</text><rect x="345" y="55" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="467.5" y="91.0" font-size="15" text-anchor="middle">Join Place / Video</text><rect x="660" y="55" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="782.5" y="91.0" font-size="15" text-anchor="middle">Sort, then LIMIT 11</text><path d="M275,86 L345,86" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M590,86 L660,86" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="178" font-size="17" text-anchor="start">After: select IDs through the covering index</text><rect x="30" y="201" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="152.5" y="237.0" font-size="15" text-anchor="middle">Sort + LIMIT in index</text><rect x="345" y="201" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="467.5" y="237.0" font-size="15" text-anchor="middle">11 selected post IDs</text><rect x="660" y="201" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="782.5" y="227.0" font-size="15" text-anchor="middle">Fetch join details</text><text x="782.5" y="247.0" font-size="15" text-anchor="middle">~11 loops</text><path d="M275,232 L345,232" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M590,232 L660,232" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470" y="308" font-size="14" text-anchor="middle">Read fewer rows before joining the inheritance hierarchy.</text></g></svg>