<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" role="img" aria-label="Full-text search before and after separating OR predicates"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566775"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#22313c"><text x="30" y="32" font-size="17" text-anchor="start">Before: join first, filter last</text><rect x="30" y="55" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="152.5" y="91.0" font-size="15" text-anchor="middle">~1,000,000 post lookups</text><rect x="345" y="55" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="467.5" y="91.0" font-size="15" text-anchor="middle">Join experience rows</text><rect x="660" y="55" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="782.5" y="81.0" font-size="15" text-anchor="middle">Apply OR filter</text><text x="782.5" y="101.0" font-size="15" text-anchor="middle">Return 11 results</text><path d="M275,86 L345,86" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M590,86 L660,86" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="172" font-size="17" text-anchor="start">After: independent FTS queries, then bounded joins</text><rect x="30" y="205" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="152.5" y="241.0" font-size="15" text-anchor="middle">FTS: post.title</text><rect x="30" y="305" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="152.5" y="341.0" font-size="15" text-anchor="middle">FTS: experience.name</text><rect x="360" y="255" width="245" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="482.5" y="291.0" font-size="15" text-anchor="middle">Merge + deduplicate IDs</text><rect x="675" y="255" width="230" height="62" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="790.0" y="291.0" font-size="15" text-anchor="middle">Fetch join 11 results</text><path d="M275,236 L360,276" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M275,336 L360,296" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M605,286 L675,286" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="780" y="367" font-size="17" text-anchor="middle">13.8 s → 82 ms</text></g></svg>