<svg xmlns="http://www.w3.org/2000/svg" width="940" height="610" viewBox="0 0 940 610" role="img" aria-label="Daily reindexing with alias swap and watermark catch-up"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566775"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#22313c"><rect x="33" y="20" width="184" height="48" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="125.0" y="49.0" font-size="15" text-anchor="middle">Batch job</text><path d="M125,68 V570" stroke="#bbc5cc" stroke-dasharray="5 5"/><rect x="263" y="20" width="184" height="48" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="355.0" y="49.0" font-size="15" text-anchor="middle">MySQL</text><path d="M355,68 V570" stroke="#bbc5cc" stroke-dasharray="5 5"/><rect x="493" y="20" width="184" height="48" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="585.0" y="49.0" font-size="15" text-anchor="middle">New ES index</text><path d="M585,68 V570" stroke="#bbc5cc" stroke-dasharray="5 5"/><rect x="723" y="20" width="184" height="48" rx="3" fill="#eef4f8" stroke="#9babba"/><text x="815.0" y="49.0" font-size="15" text-anchor="middle">Search alias</text><path d="M815,68 V570" stroke="#bbc5cc" stroke-dasharray="5 5"/><path d="M125,112 L355,112" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240.0" y="103.0" font-size="13" text-anchor="middle">1. Record T0; check replica GTID</text><path d="M125,177 L585,177" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="355.0" y="168.0" font-size="13" text-anchor="middle">2. Create new index</text><path d="M355,242 L585,242" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470.0" y="233.0" font-size="13" text-anchor="middle">3. Snapshot and bulk index</text><path d="M125,307 L815,307" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470.0" y="298.0" font-size="13" text-anchor="middle">4. Swap alias after a successful build</text><path d="M125,372 L355,372" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240.0" y="363.0" font-size="13" text-anchor="middle">5. Record T1 on primary</text><path d="M355,437 L585,437" fill="none" stroke="#566775" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470.0" y="428.0" font-size="13" text-anchor="middle">6. Replay changes in (T0, T1]</text><rect x="455" y="481" width="260" height="62" rx="3" fill="#fff7df" stroke="#9babba"/><text x="585.0" y="507.0" font-size="15" text-anchor="middle">Update only if DB.modified_at</text><text x="585.0" y="527.0" font-size="15" text-anchor="middle">is newer than ES.modified_at</text><text x="470" y="590" font-size="14" text-anchor="middle">The existing alias remains active if the full rebuild fails.</text></g></svg>